name: build-windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Versions come from go.mod, so this workflow cannot drift from it.
      - name: Check out ownframe and blinkless siblings
        shell: bash
        run: .github/scripts/checkout-siblings.sh

      - name: Build Windows binary
        shell: pwsh
        run: go build -o own-code-windows-amd64.exe ./cmd/own-code

      - uses: actions/upload-artifact@v4
        with:
          name: own-code-windows-amd64.exe
          path: own-code-windows-amd64.exe
          if-no-files-found: error
