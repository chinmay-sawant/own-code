name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ebiten build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libasound2-dev xvfb

      - name: Check out ownframe and blinkless siblings (versions from go.mod)
        run: .github/scripts/checkout-siblings.sh

      - name: gofmt
        run: |
          out="$(gofmt -l assets.go cmd internal)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: xvfb-run -a go test -p 1 ./...

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory until the linter set is tuned
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ebiten build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libasound2-dev
      - run: .github/scripts/checkout-siblings.sh
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check out ownframe and blinkless siblings (versions from go.mod)
        shell: bash
        run: .github/scripts/checkout-siblings.sh
      - name: Build
        run: go build ./cmd/own-code
